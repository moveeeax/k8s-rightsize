name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          go build -o k8s-rightsize .
          ./k8s-rightsize --version
      - name: Smoke run against the example fixture
        run: ./k8s-rightsize --source file --file examples/usage.json
